<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stories 管理后台</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; background: #f5f5f5; color: #222; }
  .hidden { display: none !important; }
  #login { max-width: 360px; margin: 120px auto; background: #fff; padding: 32px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,.08); }
  #login h1 { font-size: 20px; margin: 0 0 20px; }
  input, textarea, select { width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; font-family: inherit; background: #fff; }
  textarea { min-height: 70px; resize: vertical; }
  button { padding: 8px 16px; border: 0; border-radius: 8px; background: #07c160; color: #fff; font-size: 14px; cursor: pointer; }
  button.gray { background: #888; }
  button.red { background: #e74c3c; }
  button.small { padding: 4px 10px; font-size: 12px; }
  button:disabled { opacity: .5; cursor: default; }
  #app { display: flex; min-height: 100vh; }
  #side { width: 170px; background: #2e2e2e; color: #ccc; padding: 16px 0; flex-shrink: 0; }
  #side h1 { font-size: 16px; color: #fff; padding: 0 16px 12px; margin: 0; }
  #side a { display: block; padding: 10px 16px; color: #ccc; text-decoration: none; font-size: 14px; cursor: pointer; }
  #side a.active { background: #07c160; color: #fff; }
  #main { flex: 1; padding: 20px; max-width: 1080px; }
  .card { background: #fff; border-radius: 10px; padding: 16px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .row > * { flex: 0 0 auto; }
  .grow { flex: 1 1 auto !important; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  label.f { display: block; font-size: 12px; color: #666; margin: 8px 0 3px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid #eee; vertical-align: middle; }
  th { color: #888; font-weight: 500; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; }
  .tag.ok { background: #e8f8ee; color: #07c160; }
  .tag.err { background: #fdecea; color: #e74c3c; }
  .tag.wait { background: #fff6e5; color: #e6a23c; }
  .msg { max-height: 420px; overflow: auto; background: #fafafa; border-radius: 8px; padding: 10px; font-size: 13px; }
  .msg .m { margin: 4px 0; }
  .msg .u { color: #07c160; }
  .msg .c { color: #333; }
  .hint { font-size: 12px; color: #999; }
  .toast { position: fixed; top: 16px; right: 16px; background: #333; color: #fff; padding: 10px 16px; border-radius: 8px; z-index: 99; font-size: 13px; }
  img.thumb { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; background:#eee; }
  .swatches img { width: 90px; height: 60px; border-radius: 6px; object-fit: cover; margin: 4px; border: 2px solid transparent; cursor: pointer; }
  .swatches img.sel { border-color: #07c160; }
@media (max-width: 780px) {
  /* 手机端适配（管理台 App / 手机浏览器）：
     侧栏变成顶部横向滚动条，表格横向滚动，输入框与按钮更适合手指点按 */
  #app, #wrap, body > div { flex-direction: column; }
  #side { width: 100%; display: flex; overflow-x: auto; padding: 6px 4px; gap: 4px; }
  #side h1 { display: none; }
  #side a { white-space: nowrap; padding: 8px 12px; border-radius: 8px; font-size: 13.5px; }
  #main { padding: 10px; max-width: none; }
  .card { padding: 12px; border-radius: 8px; }
  table { display: block; overflow-x: auto; white-space: nowrap; -webkit-overflow-scrolling: touch; }
  table thead, table tbody { display: table; width: 100%; }
  .grid2, .grid3 { grid-template-columns: 1fr; }
  input, textarea, select { font-size: 15px; }
  button { padding: 9px 14px; }
  .row { flex-wrap: wrap; }
}
</style>
</head>
<body>

<div id="login">
  <h1>Stories 管理后台</h1>
  <input id="pw" type="password" placeholder="管理口令" onkeydown="if(event.key==='Enter')doLogin()">
  <div style="height:12px"></div>
  <button style="width:100%" onclick="doLogin()">登录</button>
  <p id="loginErr" class="hint" style="color:#e74c3c;margin-top:10px"></p>
</div>

<div id="app" class="hidden">
  <div id="side">
    <h1>Stories</h1>
    <a data-tab="chars" class="active" onclick="switchTab('chars')">角色管理</a>
    <a data-tab="kb" onclick="switchTab('kb')">知识库</a>
    <a data-tab="stickers" onclick="switchTab('stickers')">表情包</a>
    <a data-tab="bg" onclick="switchTab('bg')">背景图库</a>
    <a data-tab="records" onclick="switchTab('records')">聊天记录</a>
  <a data-tab="moments" onclick="switchTab('moments')">朋友圈</a>
  <a data-tab="worlds" onclick="switchTab('worlds')">世界</a>
  <a data-tab="memory" onclick="switchTab('memory')">记忆</a>
  <a data-tab="settings" onclick="switchTab('settings')">设置与日志</a>
    <a onclick="logout()" style="color:#888;margin-top:20px">退出登录</a>
  </div>
  <div id="main"></div>
</div>

<script>
const API = '';
let TOKEN = localStorage.getItem('stories_token') || '';
let CHARS = [];

function toast(msg, ms=2200) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), ms);
}
function esc(s) { return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtTime(ts) {
  if (ts == null) return '';
  const d = new Date(Number(ts) * 1000);
  return isNaN(d.getTime()) ? '' : d.toLocaleString('zh-CN', {hour12: false});
}
// 媒体文件带管理令牌（服务端对 /media /uploads 校验 token）
function tokUrl(u) {
  if (!u) return '';
  const s = String(u);
  if (s.startsWith('http')) return s;
  const sep = s.includes('?') ? '&' : '?';
  return s + sep + 'token=' + TOKEN;
}

// ===== 模型列表（真·下拉选择 + 自定义输入）=====
let MODELS = null;
async function loadModels() {
  if (MODELS) return MODELS;
  try {
    const d = await api('/admin/api/models');
    MODELS = (d && typeof d === 'object' && Array.isArray(d.chat)) ? d : {chat: [], deepseek: [], image: [], video: [], all: []};
  } catch (_) { MODELS = {chat: [], deepseek: [], image: [], video: [], all: []}; }
  return MODELS;
}
function modelField(id, label, current, options, hint) {
  options = options || [];
  const optVal = (o) => (typeof o === 'string' ? o : (o && o.value) || '');
  const optLab = (o) => (typeof o === 'string' ? o : (o && (o.label || o.value)) || '');
  const isCustom = !!current && !options.some((o) => optVal(o) === current);
  let opts = '<option value="">（使用默认）</option>';
  for (const o of options) opts += `<option value="${esc(optVal(o))}"${optVal(o) === current ? ' selected' : ''}>${esc(optLab(o))}</option>`;
  opts += `<option value="__custom__"${isCustom ? ' selected' : ''}>自定义…</option>`;
  return `<div><label class="f">${label}</label>
    <select id="${id}_sel" onchange="onModelSel('${id}')" style="width:100%">${opts}</select>
    <input id="${id}_custom" placeholder="输入模型名" value="${esc(isCustom ? current : '')}" style="margin-top:4px;display:${isCustom ? 'block' : 'none'}">
    ${hint ? `<div class="hint">${hint}</div>` : ''}
  </div>`;
}
function onModelSel(id) {
  const sel = document.getElementById(id + '_sel');
  const inp = document.getElementById(id + '_custom');
  if (sel && inp) inp.style.display = sel.value === '__custom__' ? 'block' : 'none';
}
function modelValue(id) {
  const sel = document.getElementById(id + '_sel');
  if (!sel) return '';
  if (sel.value === '__custom__') {
    const inp = document.getElementById(id + '_custom');
    return inp ? inp.value.trim() : '';
  }
  return sel.value;
}

async function api(path, opts={}) {
  const headers = Object.assign({}, opts.headers || {});
  if (TOKEN) headers['X-Admin-Token'] = TOKEN;
  if (opts.json) { headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(opts.json); opts.method = opts.method || 'POST'; }
  const r = await fetch(API + path, Object.assign({}, opts, { headers }));
  if (r.status === 401) { logout(); throw new Error('登录过期'); }
  const ct = r.headers.get('content-type') || '';
  if (ct.includes('application/json')) return r.json();
  return r.text();
}

async function doLogin() {
  const errEl = document.getElementById('loginErr');
  try {
    const pw = document.getElementById('pw').value;
    const r = await fetch('/admin/login', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({password: pw})});
    if (!r.ok) { errEl.textContent = `登录失败（HTTP ${r.status}）`; return; }
    const d = await r.json();
    if (!d.ok) { errEl.textContent = d.error || '登录失败'; return; }
    TOKEN = d.token; localStorage.setItem('stories_token', TOKEN);
    errEl.textContent = '';
    showApp();
  } catch (e) {
    errEl.textContent = '连接服务器失败，请稍后重试';
  }
}
function logout() { TOKEN=''; localStorage.removeItem('stories_token'); location.reload(); }
function showApp() {
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  switchTab('chars');
}

let TAB = 'chars';
function switchTab(tab) {
  TAB = tab;
  document.querySelectorAll('#side a[data-tab]').forEach(a => a.classList.toggle('active', a.dataset.tab === tab));
  const main = document.getElementById('main');
  if (tab === 'chars') renderChars();
  else if (tab === 'kb') renderKb();
  else if (tab === 'stickers') renderStickers();
  else if (tab === 'bg') renderBg();
  else if (tab === 'records') renderRecords();
  else if (tab === 'moments') renderMoments();
  else if (tab === 'worlds') renderWorlds();
  else if (tab === 'memory') renderMemory();
  else if (tab === 'settings') renderSettings();
}

// ================= 角色 =================
async function loadChars() {
  const d = await api('/admin/api/characters');
  CHARS = d.characters || [];
  return CHARS;
}

async function renderChars() {
  const chars = await loadChars();
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="card">
      <div class="row"><b>角色列表</b><span class="grow"></span>
      <button onclick="editChar(null)">＋ 新建角色</button></div>
      <div style="height:10px"></div>
      <table><thead><tr><th>ID</th><th>头像</th><th>名字</th><th>照片</th><th>语音</th><th>表情</th><th>提醒</th><th>消息数</th><th>操作</th></tr></thead>
      <tbody>${chars.map(c => `
        <tr>
          <td>${c.id}</td>
          <td>${c.avatar_url ? `<img class="thumb" src="${esc(tokUrl(c.avatar_url))}">` : '<span class="hint">默认</span>'}</td>
          <td><b>${esc(c.name)}</b><div class="hint">${esc((c.description||'').slice(0,30))}</div></td>
          <td>${c.chat.photo_enabled ? '<span class="tag ok">开</span>' : '<span class="tag">关</span>'}</td>
          <td>${c.chat.voice_enabled ? '<span class="tag ok">开</span>' : '<span class="tag">关</span>'}</td>
          <td>${c.chat.sticker_enabled ? '<span class="tag ok">开</span>' : '<span class="tag">关</span>'}</td>
          <td>${c.reminder && c.reminder.enabled ? `<span class="tag ok">${c.reminder.week_count}/${c.reminder.target}</span>` : '<span class="tag">关</span>'}</td>
          <td>${c.msg_count || 0}</td>
          <td>
            <button class="small" onclick="editChar(${c.id})">编辑</button>
            <button class="small red" onclick="delChar(${c.id})">删除</button>
          </td>
        </tr>`).join('')}${chars.length === 0 ? '<tr><td colspan="9" class="hint">还没有角色，点右上角新建</td></tr>' : ''}</tbody></table>
    </div>`;
}

async function editChar(id) {
  const c = id ? CHARS.find(x => x.id === id) : null;
  const f = c ? (c.fields || {}) : {};
  const chat = c ? c.chat : {photo_enabled:false, voice_enabled:false, sticker_enabled:true, background:''};
  const models = await loadModels();
  const charTextModels = [
    ...(models.chat || []).map((id) => ({
      value: id,
      label: id + (/deepseek/i.test(id) ? '（豆包·方舟托管）' : '（豆包）'),
    })),
    ...(models.deepseek || []).map((id) => ({ value: id, label: id + '（DeepSeek 官方）' })),
  ];
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="card">
      <div class="row"><b>${c ? '编辑角色 #' + c.id : '新建角色'}</b><span class="grow"></span>
        <button class="gray" onclick="renderChars()">返回</button></div>
      <div class="grid2">
        <div><label class="f">名字 *</label><input id="f_name" value="${esc(c?c.name:'')}"><div class="hint">聊天列表与聊天页顶部显示的名字（必填）</div></div>
        <div><label class="f">简介（列表/管理用）</label><input id="f_desc" value="${esc(c?c.description:'')}"><div class="hint">仅供列表/管理展示，AI 对话不读取</div></div>
      </div>
      <div class="grid3">
        <div><label class="f">对方称呼</label><input id="f_nickname" value="${esc(f.nickname||'')}"><div class="hint">AI 平时怎么称呼你</div></div>
        <div><label class="f">性别</label><input id="f_gender" value="${esc(f.gender||'')}"><div class="hint">影响 AI 语气与自我认知</div></div>
        <div><label class="f">年龄</label><input id="f_age" value="${esc(f.age||'')}"><div class="hint">角色的年龄设定</div></div>
      </div>
      <div class="grid3">
        <div><label class="f">身份/职业</label><input id="f_job" value="${esc(f.job||'')}"><div class="hint">例：工程师、学生、医生</div></div>
        <div><label class="f">性格</label><input id="f_personality" value="${esc(f.personality||'')}"><div class="hint">影响语气，例：温柔、傲娇、毒舌</div></div>
        <div><label class="f">说话风格</label><input id="f_style" value="${esc(f.style||'')}"><div class="hint">影响用词，例：短句、爱用颜文字</div></div>
      </div>
      <div class="grid2">
        <div><label class="f">口癖/习惯</label><input id="f_habits" value="${esc(f.habits||'')}"><div class="hint">口头禅或小动作</div></div>
        <div><label class="f">禁忌</label><input id="f_taboo" value="${esc(f.taboo||'')}"><div class="hint">绝不做的事 / 不聊的话题，可留空</div></div>
      </div>
      <label class="f">故事背景（世界背景、社会背景等；留空 = 默认「现在」当代现实世界）</label>
      <textarea id="f_story" style="min-height:100px">${esc(c?c.story:'')}</textarea><div class="hint">填了它，AI 会严格按此世界观演绎；留空 = 默认「现在」当代现实世界</div>
      <label class="f">人设（自由文本，System Prompt）</label>
      <textarea id="f_persona" style="min-height:160px">${esc(c?c.persona_full:'')}</textarea><div class="hint">最核心的设定底稿（System Prompt）：身份、经历、与玩家的关系、说话习惯；越详细越像</div>
      <div class="grid3">
        <div><label class="f">开场白</label><input id="f_greeting" value="${esc(c?c.greeting:'')}"><div class="hint">首次进入聊天时角色主动发的第一句</div></div>
        ${modelField('f_model', '模型（留空=使用全局主模型）', c?c.model:'', charTextModels, '该角色单独使用的对话模型；标注了来源（豆包 / 豆包·方舟托管 / DeepSeek 官方），保存后自动路由；留空=用后台设置的全局主模型')}
        <div><label class="f">温度 temperature</label><input id="f_temp" type="number" step="0.1" value="${c?c.temperature:0.9}"><div class="hint">推荐 0.8~1.1（越高越活泼）；过高会崩人设、答非所问，超过 1.3 会被按 1.3 处理</div></div>
      </div>
      <div style="height:6px"></div>
      <div class="row" style="gap:18px">
        <label><input type="checkbox" id="f_photo" style="width:auto" ${chat.photo_enabled?'checked':''}> 照片生成</label>
        <label><input type="checkbox" id="f_voice" style="width:auto" ${chat.voice_enabled?'checked':''}> 语音</label>
        <label><input type="checkbox" id="f_sticker" style="width:auto" ${chat.sticker_enabled?'checked':''}> 表情包</label>
        <label><input type="checkbox" id="f_video" style="width:auto" ${chat.video_enabled?'checked':''}> 视频</label>
        <label><input type="checkbox" id="f_wake" style="width:auto" ${chat.wake_enabled !== false ? 'checked' : ''}> 自动回复</label>
      </div>
      <div class="row" style="gap:18px;margin-top:6px">
        <label><input type="checkbox" id="f_imgdesc" style="width:auto" ${chat.img_desc_enabled !== false ? 'checked' : ''}> 图片转述（把用户的图片转成文字再交给该角色的模型）</label>
      </div>
      <div class="hint">照片 / 语音 / 表情 / 视频 / 自动回复 / 图片转述为每个角色独立开关（默认：照片关、语音关、视频关、表情开、自动回复开、图片转述开）。若该角色用多模态对话模型（如豆包），可关闭「图片转述」，让原图直接交给模型看图。</div>
      <div class="grid2" style="margin-top:6px">
        <label><input type="checkbox" id="f_reminder" style="width:auto" ${(c && c.reminder && c.reminder.enabled) ? 'checked' : ''}> 提醒插件（reminder）</label>
        <div><label class="f">每周提醒目标（次）</label><input id="f_reminder_target" type="number" value="${c && c.reminder ? c.reminder.target : 5}"><div class="hint">本周进度：${c && c.reminder ? c.reminder.week_count : 0} / ${c && c.reminder ? c.reminder.target : 5}（冷却参数在设置页）</div></div>
      </div>
      <div class="row" style="margin-top:6px;gap:18px">
        <label><input type="checkbox" id="f_mauto" style="width:auto" ${c && c.chat && c.chat.moments_auto ? 'checked' : ''}> 自动发朋友圈</label>
        <label><input type="checkbox" id="f_mreact" style="width:auto" ${!c || !c.chat || c.chat.moments_react ? 'checked' : ''}> 朋友圈互动（点赞/评论你的动态）</label>
      </div>
      <div style="height:10px"></div>
      <div class="row">
        <button onclick="saveChar(${c?c.id:'null'})">保存</button>
        ${c ? `<input type="file" id="f_avatar" accept="image/*" style="width:240px">
               <button class="gray" onclick="uploadAvatar(${c.id})">上传头像</button>` : ''}
      </div>
    </div>`;
}

async function saveChar(id) {
  const val = k => document.getElementById(k)?.value || '';
  const body = {
    name: val('f_name'), description: val('f_desc'), persona_full: val('f_persona'), story: val('f_story'),
    greeting: val('f_greeting'), model: modelValue('f_model'),
    temperature: Number.isFinite(parseFloat(val('f_temp'))) ? parseFloat(val('f_temp')) : 0.9,
    fields: {
      nickname: val('f_nickname'), gender: val('f_gender'), age: val('f_age'),
      job: val('f_job'), personality: val('f_personality'), style: val('f_style'),
      habits: val('f_habits'), taboo: val('f_taboo'),
    },
    chat: {
      photo_enabled: document.getElementById('f_photo').checked,
      voice_enabled: document.getElementById('f_voice').checked,
      sticker_enabled: document.getElementById('f_sticker').checked,
      video_enabled: document.getElementById('f_video').checked,
      wake_enabled: document.getElementById('f_wake').checked,
      reminder_enabled: document.getElementById('f_reminder').checked,
      reminder_target: parseInt(document.getElementById('f_reminder_target').value) || 5,
      moments_auto: document.getElementById('f_mauto').checked,
      moments_react: document.getElementById('f_mreact').checked,
      img_desc_enabled: document.getElementById('f_imgdesc').checked,
    },
  };
  if (id) {
    body.id = id;
    // 管理页不编辑这两个字段：从当前角色带回，避免保存时被重置（App 已同样处理）
    const cur = CHARS.find(x => x.id === id);
    if (!cur) { toast('角色已不存在，请刷新列表'); return; }
    body.enabled = cur.enabled; body.sort_order = cur.sort_order;
  }
  const r = await api('/api/character/save', {json: body});
  toast(r.ok ? '已保存' : '保存失败');
  renderChars();
}

async function delChar(id) {
  const c = CHARS.find(x => x.id === id);
  if (!confirm(`确认删除角色「${c.name}」？聊天记录与知识库都会删除！`)) return;
  await api('/api/character/delete', {json: {id}});
  toast('已删除'); renderChars();
}

async function uploadAvatar(id) {
  const f = document.getElementById('f_avatar').files[0];
  if (!f) { toast('先选择图片'); return; }
  const fd = new FormData(); fd.append('character_id', id); fd.append('file', f);
  const r = await api('/api/character/avatar', {method:'POST', body: fd});
  toast(r.ok ? '头像已更新' : '上传失败');

async function loadKbList() {
  const t = document.getElementById('kb_target').value;
  const cid = t.startsWith('char:') ? t.split(':')[1] : 0;
  const d = await api('/api/kb/list?character_id=' + cid);
  const docs = [...(d.character||[]), ...(d.public||[]).map(x=>({...x, _pub:true}))];
  const statusTag = s => s === 'ready' ? '<span class="tag ok">就绪</span>' : s === 'error' ? '<span class="tag err">失败</span>' : '<span class="tag wait">处理中</span>';
  document.getElementById('kb_list').innerHTML = `

    <tbody>${docs.map(x => `
      <tr><td>${x.id}</td><td>${esc(x.filename)}</td>
      <td>${x._pub || (t==='public') ? '公共' : '角色'}</td>
      <td>${statusTag(x.status)}</td><td>${x.chunk_count||0}</td>
      <td class="hint">${esc((x.error||'').slice(0,40))}</td>
      <td><button class="small red" onclick="delKb(${x.id})">删除</button></td></tr>`).join('')}
    ${docs.length===0?'<tr><td colspan="7" class="hint">暂无文档</td></tr>':''}</tbody></table>`;
}

async function uploadKb() {
  const t = document.getElementById('kb_target').value;
  const f = document.getElementById('kb_file').files[0];
  if (!f) { toast('先选择文件'); return; }
  const fd = new FormData();
  if (t === 'public') { fd.append('scope','public'); fd.append('character_id','0'); }
  else { fd.append('scope','character'); fd.append('character_id', t.split(':')[1]); }
  fd.append('file', f);
  const r = await api('/api/kb/upload', {method:'POST', body: fd});
  toast(r.ok ? `上传成功（${r.chunks} 块），正在向量化` : ('失败: ' + (r.error||r.detail||'')));
  loadKbList();
}

async function delKb(id) {
  if (!confirm('删除该知识库文档？')) return;
  await api('/api/kb/delete', {json: {id}});
  toast('已删除'); loadKbList();
}

  let memItems = [];

    </div>

async function createWorld() {
  const name = (document.getElementById('world_new_name').value || '').trim();
  if (!name) { toast('请输入世界名称'); return; }
  await api('/admin/api/world/create', {json: {name, cids: []}});
  toast('已创建，请在下方勾选成员并保存');
  renderWorlds();
}
async function saveWorldSettings() {
  const maxV = parseInt(document.getElementById('s_world_max').value, 10);
  const dayV = parseInt(document.getElementById('s_world_days').value, 10);
  const body = {settings: {
    world_recognize_enabled: document.getElementById('s_world_rec').checked ? 1 : 0,
    world_context_max: Math.max(1, Math.min(50, Number.isFinite(maxV) ? maxV : 10)),
    world_context_days: Math.max(1, Math.min(90, Number.isFinite(dayV) ? dayV : 7)),
  }};
  await api('/admin/api/settings', {json: body});
  toast('已保存（立即生效）');
}
async function saveWorld(id) {
  const name = (document.getElementById('world_name_' + id).value || '').trim();
  const cids = [...document.querySelectorAll('.wmem_' + id)].filter(c => c.checked).map(c => parseInt(c.value));
  await api('/admin/api/world/settings', {json: {id, name, cids}});
  toast(`已保存（${cids.length} 个成员，立即生效）`);
  renderWorlds();
}
async function deleteWorld(id) {
  if (!confirm('删除该世界？成员关系与世界动态都会删除（不影响角色本身）')) return;
  await api('/admin/api/world/settings', {json: {id, delete: true}});
  toast('已删除');
  renderWorlds();
}
async function broadcastWorld(id) {
  const el = document.getElementById('world_bc_' + id);
  const content = ((el && el.value) || '').trim();
  if (!content) { toast('请输入广播内容'); return; }
  await api('/admin/api/world/broadcast', {json: {world_id: id, content}});
  toast('已广播，同世界角色都会知道');
  renderWorlds();
}
async function delWorldEvent(id) {
  if (!confirm('删除这条世界动态？')) return;
  await api('/admin/api/world/event/delete', {json: {id}});
  toast('已删除');
  renderWorlds();
}
async function exportRec(format) {
  const cid = document.getElementById('rec_char').value;
  // 直接用 fetch 取原始文本（api() 会把 JSON 解析成对象，导出会变成 [object Object]）
  const r = await fetch(`${API}/admin/api/export?character_id=${cid}&format=${format}`, {
    headers: TOKEN ? {'X-Admin-Token': TOKEN} : {},
  });
  if (r.status === 401) { logout(); return; }
  if (!r.ok) { toast('导出失败（登录可能已过期）'); return; }
  const text = await r.text();
  const blob = new Blob([text], {type: format==='json'?'application/json':'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `stories_${cid}_${Date.now()}.${format}`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

  const cfg = d.config || {};
  const recs = d.recalls || [];

  const keys = Object.keys(scopes).sort();

  const main = document.getElementById('main');
  main.innerHTML = `

        <div>总开关：<b>${cfg.enabled ? '开启' : '关闭'}</b></div>
        <div>丢弃阈值：私聊 <b>${cfg.judge_p_single}</b> / 群聊 <b>${cfg.judge_p_group}</b></div>
        <div>召回上限：私聊+知识库 <b>${cfg.topn}</b> / 群聊 <b>${cfg.group_topn}</b>（群语境 ${cfg.group_topn_relax}）</div>
        <div>时间衰减半衰期：<b>${cfg.decay_days}</b> 天</div>
      </div>
      <div style="height:10px"></div>
      <table><thead><tr><th>范围</th><th>条数</th><th>已淡出</th><th>置顶</th><th>体积</th><th>索引水位</th><th>操作</th></tr></thead><tbody>
      ${keys.map(k => `<tr>
        <td>${esc(nameOf[k] || k)}</td><td>${scopes[k].count}</td><td>${scopes[k].dormant}</td>
        <td>${scopes[k].pinned}</td><td>${scopes[k].mb} MB</td><td>#${scopes[k].last_mid}</td>
        <td><button onclick="memOpen('${k}')">查看记忆</button></td></tr>`).join('')}
      </tbody></table>
    </div>
    <div class="card" id="mem_list_card" style="display:none"></div>
    <div class="card">
      <b>最近检索命中（最近 30 次）</b>
      <p class="hint">排查「她为什么不记得」用：这里能看到每次回复实际召回了哪些记忆、来自私聊还是群聊、耗时多少。</p>
      <table><thead><tr><th>时间</th><th>角色</th><th>查询</th><th>召回内容</th><th>耗时</th></tr></thead><tbody>
      ${recs.map(r => `<tr>
        <td>${fmtTime(r.ts)}</td><td>${esc(nameOf['char_' + r.cid] || ('#' + r.cid))}</td>
        <td style="max-width:200px">${esc(r.query)}</td>
        <td>${(r.items || []).map(i => `[${i.date || ''}] ${esc((i.content || '').slice(0, 40))}（${i.source === 'group' ? '群聊' : '私聊'}）`).join('<br>') || '（无召回）'}</td>
        <td>${r.latency_ms} ms</td></tr>`).join('')}
      </tbody></table>
    </div>`;
  if (MEM_SCOPE) memRenderList('');
}

async function memOpen(scope) { MEM_SCOPE = scope; MEM_PAGE = 0; await memRenderList(''); }

async function memRenderList(q) {
  if (!MEM_SCOPE) return;
  const id = _memId();
  const p = _memIsGroup() ? ('gid=' + id) : ('cid=' + id);
  const d = await api(`/admin/api/memories?${p}&limit=50&offset=${MEM_PAGE * 50}&q=${encodeURIComponent(q || '')}`);
  MEM_ITEMS = d.items || [];
  const card = document.getElementById('mem_list_card');
  card.style.display = '';
  card.innerHTML = `
    <div class="row"><b>记忆列表 · ${esc(MEM_SCOPE)}（共 ${d.total} 条）</b><span class="grow"></span>
      <input id="mem_q" placeholder="搜索内容" style="width:180px" value="${esc(q || '')}">
      <button onclick="MEM_PAGE=0;memRenderList(_memQ())">搜索</button>
      <button onclick="MEM_PAGE=Math.max(0,MEM_PAGE-1);memRenderList(_memQ())">上一页</button>
      <button onclick="MEM_PAGE++;memRenderList(_memQ())">下一页</button>
    </div>
    <table><thead><tr><th>时间</th><th>谁说的</th><th>内容</th><th>被想起</th><th>状态</th><th>操作</th></tr></thead><tbody>
    ${MEM_ITEMS.map(it => `<tr>
      <td>${fmtTime(it.ts)}</td><td>${it.role === 'user' ? '对方' : '角色'}</td>
      <td style="max-width:420px">${esc(it.content)}</td>
      <td>${it.recall_n} 次</td>
      <td>${it.pin ? '📌 置顶 ' : ''}${it.dormant ? '已淡出' : ''}</td>
      <td>
        <button onclick="memEdit(${it.mid})">编辑</button>
        <button onclick="memPin(${it.mid},${it.pin ? 0 : 1})">${it.pin ? '取消置顶' : '置顶'}</button>
        <button onclick="memDorm(${it.mid},${it.dormant ? 0 : 1})">${it.dormant ? '恢复' : '淡出'}</button>
        <button onclick="memDel(${it.mid})">删除</button>
      </td></tr>`).join('')}
    </tbody></table>`;
}

async function memPin(mid, v) {
  const b = _memPayload(mid); b.pin = v;
  await api('/admin/api/memories/update', { json: b });
  toast(v ? '已置顶（不会被遗忘）' : '已取消置顶');
  memRenderList(_memQ());
}

async function memDorm(mid, v) {
  const b = _memPayload(mid); b.dormant = v;
  await api('/admin/api/memories/update', { json: b });
  toast(v ? '已淡出（不参与检索，可恢复）' : '已恢复参与检索');
  memRenderList(_memQ());
}

async function memDel(mid) {
  if (!confirm('删除这条记忆？（不可恢复，向量会一并移除）')) return;
  await api('/admin/api/memories/delete', { json: _memPayload(mid) });
  toast('已删除');
  memRenderList(_memQ());
}

function memEdit(mid) {
  const it = MEM_ITEMS.find(x => x.mid === mid);
  const cur = it ? it.content : '';
  const v = prompt('修改记忆内容（保存后会自动重新嵌入）', cur);
  if (v === null) return;
  const b = _memPayload(mid); b.content = v;
  api('/admin/api/memories/update', { json: b }).then(() => {
    toast('已保存');
    memRenderList(_memQ());
  }).catch(() => toast('保存失败'));
}

async function memReindex(rebuild) {
  if (!MEM_SCOPE) { toast('先在总览里点「查看记忆」选一个范围'); return; }
  if (rebuild && !confirm('从头重建会重新扫描该范围的全部历史消息（已入库内容不会重复嵌入）。继续？')) return;
  const b = _memIsGroup() ? { gid: _memId(), rebuild: rebuild } : { cid: _memId(), rebuild: rebuild };
  await api('/admin/api/memory/reindex', { json: b });
  toast('已在后台开始处理（可稍后刷新查看）');
}

// boot
if (TOKEN) {
  api('/admin/api/characters').then(() => showApp()).catch(() => { TOKEN=''; localStorage.removeItem('stories_token'); });
}
</script>
</body>
</html>
