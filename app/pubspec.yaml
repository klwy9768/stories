name: stories
description: "Stories - 多角色聊天"
publish_to: 'none'
version: 1.0.60+62

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  crypto: ^3.0.3
  convert: ^3.1.1
  http: ^1.2.0
  shared_preferences: ^2.3.0
  path_provider: ^2.1.5
  path: ^1.9.0
  flutter_local_notifications: ^17.2.0
  audioplayers: ^6.1.0
  video_player: ^2.9.2
  image_picker: ^1.1.2
  photo_manager: ^3.12.0
  qr_flutter: ^4.1.0
  record: ^7.1.1
  file_picker: ^10.3.3
  flutter_background_service: ^5.0.10
  open_filex: ^4.5.0
  wechat_assets_picker: ^10.1.3
  wechat_camera_picker: ^4.6.0
  webview_flutter: ^4.10.0

dependency_overrides:
  flutter_background_service_android:
    path: plugins/flutter_background_service_android

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  image_path: "assets/icon.jpg"
  adaptive_icon_background: "#07C160"
  adaptive_icon_foreground: "assets/icon.jpg"

flutter:
  uses-material-design: true
