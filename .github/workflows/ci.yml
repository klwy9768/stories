name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Syntax check
        run: python -m py_compile backend/*.py

      - name: Smoke tests
        working-directory: backend
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: "1"
        run: |
          set +e
          python test_smoke.py 2>&1 | tee smoke.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -F "[FAIL]" smoke.log | while IFS= read -r line; do
              echo "::error::${line}"
            done
            tail -n 40 smoke.log | while IFS= read -r line; do
              echo "::error::${line}"
            done
          fi
          exit "$status"

      - name: Security tests
        working-directory: backend
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: "1"
        run: python test_security.py

      - name: Memory tests
        working-directory: backend
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: "1"
        run: python test_memory.py

      - name: Media tests (offline)
        working-directory: backend
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: "1"
        run: python test_media.py

      - name: Logging tests
        working-directory: backend
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: "1"
        run: python test_logging.py

      - name: Mailer tests
        working-directory: backend
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: "1"
        run: python test_mailer.py
